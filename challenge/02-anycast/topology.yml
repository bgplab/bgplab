# Implement Anycast Services with BGP
---
defaults.sources.extra: [ ../../defaults.yml ]
version: 25.12.03

groups:
  external:
    members: [ s1, s2, s3, c ]
    device: frr
    role: host
  fix_frr:
    members: [ '*' ]
    frr.daemons: [ bgpd, ospfd, ospf6d ]

module: [ bgp ]

nodes:
  sw:
    bgp.as: 65000
  s1:
    id: 16
  s2:
    id: 17
  s3:
    id: 18
  c:
    id: 2
    module: [ bgp ]
    bgp.as: 65100

links:
- sw:
  s1:
  s2:
  s3:
  c:
  prefix.ipv4: 172.16.42.0/24

message: |
  The "Implement Anycast Services with BGP" lab is ready.
  Use "netlab connect" to connect to the lab devices.
